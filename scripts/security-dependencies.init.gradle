import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier

// Resolved coordinates, including build plugins/transitives; never infer versions from declarations.
gradle.projectsEvaluated {
    rootProject.tasks.register('securityDependencyInventory') {
        doLast {
            def coordinates = new TreeMap<String, Map>()
            def scopes = new TreeMap<String, Set<String>>()
            rootProject.allprojects.each { project ->
                def configs = ['releaseRuntimeClasspath', 'debugRuntimeClasspath',
                               'debugUnitTestRuntimeClasspath', 'debugAndroidTestRuntimeClasspath']
                    .collect { project.configurations.findByName(it) }.findAll { it != null && it.canBeResolved }
                configs += [project.buildscript.configurations.findByName('classpath')].findAll { it != null }
                configs.each { config ->
                    config.incoming.resolutionResult.allDependencies.each { dependency ->
                        if (dependency instanceof org.gradle.api.artifacts.result.UnresolvedDependencyResult) {
                            throw new GradleException("Security inventory cannot resolve ${dependency.attempted}", dependency.failure)
                        }
                    }
                    config.incoming.resolutionResult.allComponents.each { component ->
                        def id = component.id
                        if (id instanceof ModuleComponentIdentifier) {
                            def name = "${id.group}:${id.module}"
                            def key = "${name}:${id.version}"
                            coordinates[key] = [package: [ecosystem: 'Maven', name: name], version: id.version]
                            scopes.computeIfAbsent(key) { new TreeSet<String>() }.add("${project.path}:${config.name}".toString())
                        }
                    }
                }
            }
            def output = rootProject.layout.buildDirectory.file('reports/security/dependencies.json').get().asFile
            output.parentFile.mkdirs()
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson([queries: coordinates.values().toList(), scopes: scopes]))
            logger.lifecycle("Security inventory: ${coordinates.size()} resolved Maven coordinates -> ${output}")
        }
    }
}
