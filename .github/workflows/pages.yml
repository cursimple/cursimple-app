name: Pages

# 官网已迁到独立仓库 cursimple/cursimple.github.io（https://cursimple.github.io/）。
# 这里只发布一个跳转页，让旧地址 https://cursimple.github.io/cursimple-app/ 的链接继续有效。
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Build redirect page
        run: |
          mkdir _site
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="zh-CN">
          <head>
          <meta charset="utf-8">
          <title>课简 CurSimple</title>
          <meta name="robots" content="noindex">
          <link rel="canonical" href="https://cursimple.github.io/">
          <meta http-equiv="refresh" content="0; url=https://cursimple.github.io/">
          <script>location.replace('https://cursimple.github.io/' + location.search + location.hash);</script>
          </head>
          <body><p>官网已迁移到 <a href="https://cursimple.github.io/">https://cursimple.github.io/</a></p></body>
          </html>
          HTML
          cp _site/index.html _site/404.html

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload redirect page
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
