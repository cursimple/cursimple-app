name: Android CI

on:
  pull_request:
  push:
    branches:
      - main
      - pre

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Test release tooling
        run: python3 -B -m unittest discover -s scripts/tests -v

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission
        run: chmod +x ./gradlew

      # Run tests in every module.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Android Lint
        run: ./gradlew lintDebug

      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-reports-${{ github.sha }}
          path: "**/build/reports/lint-results-*.html"
          if-no-files-found: ignore

      - name: Build CI debug package
        run: ./gradlew assembleDebug

      # Compile opt-in QA tests; execution requires the corresponding Qa=true argument.
      - name: Build gated QA test packages
        run: ./gradlew :app:assembleDebugAndroidTest :feature-plugin:assembleDebugAndroidTest

      - name: Upload CI APK artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-apk-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            feature-plugin/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
