name: Android CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test release tooling
        run: python3 -B -m unittest discover -s scripts/tests -v

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Load signing env
        shell: pwsh
        env:
          CLASS_VIEWER_KEYSTORE_BASE64: ${{ secrets.CLASS_VIEWER_KEYSTORE_BASE64 }}
          CLASS_VIEWER_KEYSTORE_PASSWORD: ${{ secrets.CLASS_VIEWER_KEYSTORE_PASSWORD }}
          CLASS_VIEWER_KEY_ALIAS: ${{ secrets.CLASS_VIEWER_KEY_ALIAS }}
          CLASS_VIEWER_KEY_PASSWORD: ${{ secrets.CLASS_VIEWER_KEY_PASSWORD }}
        run: ./scripts/load-signing-env.ps1 -OutputDir $env:RUNNER_TEMP

      # Run tests in every module.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Android Lint
        run: ./gradlew lintDebug

      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports-${{ github.sha }}
          path: "**/build/reports/lint-results-*.html"
          if-no-files-found: ignore

      - name: Build CI debug package
        run: ./gradlew assembleDebug

      # Compile opt-in QA tests; execution requires the corresponding Qa=true argument.
      - name: Build gated QA test packages
        run: ./gradlew :app:assembleDebugAndroidTest :feature-plugin:assembleDebugAndroidTest

      - name: Upload CI APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-apk-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            feature-plugin/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
