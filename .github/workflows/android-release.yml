name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Load signing env
        shell: pwsh
        env:
          CLASS_VIEWER_KEYSTORE_BASE64: ${{ secrets.CLASS_VIEWER_KEYSTORE_BASE64 }}
          CLASS_VIEWER_KEYSTORE_PASSWORD: ${{ secrets.CLASS_VIEWER_KEYSTORE_PASSWORD }}
          CLASS_VIEWER_KEY_ALIAS: ${{ secrets.CLASS_VIEWER_KEY_ALIAS }}
          CLASS_VIEWER_KEY_PASSWORD: ${{ secrets.CLASS_VIEWER_KEY_PASSWORD }}
        run: ./scripts/load-signing-env.ps1 -OutputDir $env:RUNNER_TEMP

      - name: Verify tag matches app.versionName
        shell: pwsh
        run: |
          $properties = @{}
          foreach ($rawLine in Get-Content -LiteralPath "gradle.properties") {
            $line = $rawLine.Trim()
            if ($line -eq "" -or $line.StartsWith("#")) { continue }
            $separator = $line.IndexOf("=")
            if ($separator -lt 1) { continue }
            $properties[$line.Substring(0, $separator).Trim()] = $line.Substring($separator + 1).Trim()
          }
          $versionName = $properties["app.versionName"]
          $expected = "v$versionName"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag $($env:GITHUB_REF_NAME) does not match app.versionName ($expected). Bump gradle.properties first."
          }
          Write-Output "Tag matches app.versionName: $expected"

      - name: Configure release ABI splits
        shell: pwsh
        run: |
          $buildFile = "app/build.gradle.kts"
          $content = Get-Content -Raw -LiteralPath $buildFile
          $current = 'include("armeabi-v7a", "arm64-v8a")'
          $target = 'include("armeabi-v7a", "arm64-v8a", "x86", "x86_64")'
          if ($content.Contains($current)) {
            $content.Replace($current, $target) | Set-Content -NoNewline -LiteralPath $buildFile
          } elseif (-not $content.Contains($target)) {
            throw "Expected ABI split declaration was not found."
          }

      - name: Build release (4 ABIs + universal)
        run: ./gradlew assembleRelease

      - name: Rename release APKs
        shell: pwsh
        run: |
          $releaseDir = "app/build/outputs/apk/release"
          $targets = @(
            @{ Abi = "armeabi-v7a"; Regex = "(^|-)armeabi-v7a(-|$)" },
            @{ Abi = "arm64-v8a"; Regex = "(^|-)arm64-v8a(-|$)" },
            @{ Abi = "x86"; Regex = "(^|-)x86(-|$)" },
            @{ Abi = "x86_64"; Regex = "(^|-)x86_64(-|$)" },
            @{ Abi = "universal"; Regex = "(^|-)universal(-|$)" }
          )

          foreach ($target in $targets) {
            $matches = @(Get-ChildItem -LiteralPath $releaseDir -Filter "*.apk" | Where-Object { $_.BaseName -match $target.Regex })
            if ($matches.Count -ne 1) {
              throw "Expected exactly one APK for $($target.Abi), found $($matches.Count)."
            }

            Move-Item -LiteralPath $matches[0].FullName -Destination (Join-Path $releaseDir "CurSimple-$($target.Abi).apk") -Force
          }

      - name: Generate update manifest
        shell: pwsh
        run: |
          $releaseDir = "app/build/outputs/apk/release"
          $propertiesFile = "gradle.properties"
          $properties = @{}
          foreach ($rawLine in Get-Content -LiteralPath $propertiesFile) {
            $line = $rawLine.Trim()
            if ($line -eq "" -or $line.StartsWith("#")) {
              continue
            }
            $separator = $line.IndexOf("=")
            if ($separator -lt 1) {
              continue
            }
            $key = $line.Substring(0, $separator).Trim()
            $value = $line.Substring($separator + 1).Trim()
            $properties[$key] = $value
          }
          if (-not $properties.ContainsKey("app.versionCode")) {
            throw "app.versionCode was not found."
          }
          if (-not $properties.ContainsKey("app.versionName")) {
            throw "app.versionName was not found."
          }
          $versionCode = [int]$properties["app.versionCode"]
          $versionName = $properties["app.versionName"]
          $tagName = $env:GITHUB_REF_NAME
          $repo = $env:GITHUB_REPOSITORY
          $assets = @(Get-ChildItem -LiteralPath $releaseDir -Filter "CurSimple-*.apk" | Sort-Object Name | ForEach-Object {
            $fileName = $_.Name
            $abi = $fileName -replace "^CurSimple-", "" -replace "\.apk$", ""
            [ordered]@{
              abi = $abi
              fileName = $fileName
              sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              downloadUrl = "https://github.com/$repo/releases/download/$tagName/$fileName"
            }
          })
          $manifest = [ordered]@{
            schemaVersion = 1
            versionCode = $versionCode
            versionName = $versionName
            tagName = $tagName
            assets = $assets
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $releaseDir "update.json") -Encoding utf8

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/CurSimple-*.apk
            app/build/outputs/apk/release/update.json
          if-no-files-found: error

      - name: Resolve release notes
        shell: pwsh
        run: |
          $notes = "docs/release-notes/$env:GITHUB_REF_NAME.md"
          if (-not (Test-Path -LiteralPath $notes)) {
            throw "Release notes were not found at $notes."
          }
          "RELEASE_NOTES=$notes" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/CurSimple-*.apk
            app/build/outputs/apk/release/update.json
          body_path: ${{ env.RELEASE_NOTES }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      # App 检查更新先读这份清单：它在仓库里，能走国内的 jsDelivr 镜像，一次请求零点几秒；
      # GitHub API 在国内常常十几秒甚至超时。beta.json 是含测试版在内的最新版，stable.json 只算正式版，
      # 内容就是这一版的 update.json。正式版两份都更新，测试版只更新 beta.json；比现有的旧就不覆盖
      - name: Publish update feed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          set -euo pipefail
          manifest="$PWD/app/build/outputs/apk/release/update.json"
          feed_dir="$(mktemp -d)"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" update-feed >/dev/null; then
            git clone --quiet --depth 1 --branch update-feed "$remote" "$feed_dir"
          else
            git init --quiet "$feed_dir"
            git -C "$feed_dir" checkout --quiet --orphan update-feed
            git -C "$feed_dir" remote add origin "$remote"
          fi
          new_code="$(jq -r '.versionCode' "$manifest")"
          files=(beta.json)
          if [ "$IS_PRERELEASE" != "true" ]; then files+=(stable.json); fi
          changed=()
          for file in "${files[@]}"; do
            target="$feed_dir/$file"
            old_code=-1
            if [ -f "$target" ]; then old_code="$(jq -r '.versionCode // -1' "$target")"; fi
            if [ "$new_code" -ge "$old_code" ]; then
              jq --argjson prerelease "$IS_PRERELEASE" '. + {prerelease: $prerelease}' "$manifest" > "$target"
              changed+=("$file")
            else
              echo "Skip $file: existing versionCode $old_code is newer than $new_code"
            fi
          done
          # 还没发过正式版时给 stable.json 写一个「暂无正式版」标记：没开测试版的 App 读到它就知道
          # 没有可更新的正式版，不必再退回慢得多的 GitHub API 去查一遍
          if [ ! -f "$feed_dir/stable.json" ]; then
            echo '{"schemaVersion":1,"noRelease":true}' > "$feed_dir/stable.json"
            changed+=(stable.json)
          fi
          if [ ${#changed[@]} -eq 0 ]; then exit 0; fi
          git -C "$feed_dir" add "${changed[@]}"
          # 重跑同一个标签时内容不变，没东西可提交；git commit 会以失败退出，在 set -e 下把这一步判挂
          if git -C "$feed_dir" diff --cached --quiet; then exit 0; fi
          git -C "$feed_dir" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "update feed: ${GITHUB_REF_NAME}"
          git -C "$feed_dir" push --quiet origin update-feed
          for file in "${changed[@]}"; do
            curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@update-feed/${file}" >/dev/null || true
          done
