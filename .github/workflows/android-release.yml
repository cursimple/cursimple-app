name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Different tags share the update-feed branch; serialize its writers.
concurrency:
  group: android-release-update-feed
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: release_metadata
        shell: bash
        run: >-
          python3 scripts/release_metadata.py resolve
          --tag "$GITHUB_REF_NAME" --github-output "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Load signing env
        shell: pwsh
        env:
          CLASS_VIEWER_KEYSTORE_BASE64: ${{ secrets.CLASS_VIEWER_KEYSTORE_BASE64 }}
          CLASS_VIEWER_KEYSTORE_PASSWORD: ${{ secrets.CLASS_VIEWER_KEYSTORE_PASSWORD }}
          CLASS_VIEWER_KEY_ALIAS: ${{ secrets.CLASS_VIEWER_KEY_ALIAS }}
          CLASS_VIEWER_KEY_PASSWORD: ${{ secrets.CLASS_VIEWER_KEY_PASSWORD }}
        run: ./scripts/load-signing-env.ps1 -OutputDir $env:RUNNER_TEMP

      - name: Configure release ABI splits
        shell: pwsh
        run: |
          $buildFile = "app/build.gradle.kts"
          $content = Get-Content -Raw -LiteralPath $buildFile
          $current = 'include("armeabi-v7a", "arm64-v8a")'
          $target = 'include("armeabi-v7a", "arm64-v8a", "x86", "x86_64")'
          if ($content.Contains($current)) {
            $content.Replace($current, $target) | Set-Content -NoNewline -LiteralPath $buildFile
          } elseif (-not $content.Contains($target)) {
            throw "Expected ABI split declaration was not found."
          }

      - name: Build release (4 ABIs + universal)
        run: ./gradlew assembleRelease

      - name: Rename release APKs
        shell: pwsh
        run: |
          $releaseDir = "app/build/outputs/apk/release"
          $targets = @(
            @{ Abi = "armeabi-v7a"; Regex = "(^|-)armeabi-v7a(-|$)" },
            @{ Abi = "arm64-v8a"; Regex = "(^|-)arm64-v8a(-|$)" },
            @{ Abi = "x86"; Regex = "(^|-)x86(-|$)" },
            @{ Abi = "x86_64"; Regex = "(^|-)x86_64(-|$)" },
            @{ Abi = "universal"; Regex = "(^|-)universal(-|$)" }
          )

          foreach ($target in $targets) {
            $matches = @(Get-ChildItem -LiteralPath $releaseDir -Filter "*.apk" | Where-Object { $_.BaseName -match $target.Regex })
            if ($matches.Count -ne 1) {
              throw "Expected exactly one APK for $($target.Abi), found $($matches.Count)."
            }

            Move-Item -LiteralPath $matches[0].FullName -Destination (Join-Path $releaseDir "CurSimple-$($target.Abi).apk") -Force
          }

      - name: Generate update manifest
        shell: bash
        run: >-
          python3 scripts/release_metadata.py manifest
          --tag "$GITHUB_REF_NAME" --repository "$GITHUB_REPOSITORY"
          --release-dir app/build/outputs/apk/release

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/CurSimple-*.apk
            app/build/outputs/apk/release/update.json
          if-no-files-found: error

      - name: Resolve release notes
        shell: pwsh
        run: |
          $notes = "docs/release-notes/$env:GITHUB_REF_NAME.md"
          if (-not (Test-Path -LiteralPath $notes)) {
            throw "Release notes were not found at $notes."
          }
          "RELEASE_NOTES=$notes" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/CurSimple-*.apk
            app/build/outputs/apk/release/update.json
          body_path: ${{ env.RELEASE_NOTES }}
          generate_release_notes: true
          prerelease: ${{ steps.release_metadata.outputs.prerelease }}
          make_latest: ${{ steps.release_metadata.outputs.make_latest }}
          overwrite_files: true
          fail_on_unmatched_files: true

      # App 检查更新先读这份清单：它在仓库里，能走国内的 jsDelivr 镜像，一次请求零点几秒；
      # GitHub API 在国内常常十几秒甚至超时。beta.json 是含测试版在内的最新版，stable.json 只算正式版，
      # 内容就是这一版的 update.json。正式版两份都更新，测试版只更新 beta.json；比现有的旧就不覆盖
      - name: Publish update feed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ steps.release_metadata.outputs.prerelease }}
        run: |
          set -euo pipefail
          release_tool="$PWD/scripts/release_metadata.py"
          manifest="$PWD/app/build/outputs/apk/release/update.json"
          feed_dir="$(mktemp -d)"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" update-feed >/dev/null; then
            git clone --quiet --depth 1 --branch update-feed "$remote" "$feed_dir"
          else
            git init --quiet "$feed_dir"
            git -C "$feed_dir" checkout --quiet --orphan update-feed
            git -C "$feed_dir" remote add origin "$remote"
          fi
          changed_files="$(python3 "$release_tool" feed --manifest "$manifest" \
            --feed-dir "$feed_dir" --prerelease "$IS_PRERELEASE")"
          if [ -z "$changed_files" ]; then exit 0; fi
          mapfile -t changed <<< "$changed_files"
          git -C "$feed_dir" add "${changed[@]}"
          # 重跑同一个标签时内容不变，没东西可提交；git commit 会以失败退出，在 set -e 下把这一步判挂
          if git -C "$feed_dir" diff --cached --quiet; then exit 0; fi
          git -C "$feed_dir" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "update feed: ${GITHUB_REF_NAME}"
          git -C "$feed_dir" push --quiet origin update-feed
          for file in "${changed[@]}"; do
            curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@update-feed/${file}" >/dev/null || true
          done
