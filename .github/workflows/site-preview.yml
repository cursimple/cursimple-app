name: Site Preview (pre)

on:
  push:
    branches:
      - pre
    paths:
      - "site/**"
      - ".github/workflows/site-preview.yml"
  workflow_dispatch:

concurrency:
  group: site-preview-pre
  cancel-in-progress: true

permissions:
  contents: write
  statuses: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify static site
        run: |
          node --check site/i18n.js
          node --check site/releases.js
          node --check site/main.js
          node --test site/tests/*.test.cjs
          node site/check-links.cjs

      - name: Deploy to Netlify
        id: netlify
        if: env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != ''
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './site'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Preview from pre (${{ github.sha }})"
          enable-commit-status: false
          enable-commit-comment: false
          enable-pull-request-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Deploy to Instant Preview (ShipStatic)
        id: instant
        if: steps.netlify.outputs.deploy-url == ''
        shell: bash
        run: |
          set -euo pipefail
          echo "Deploying site preview via ShipStatic..."
          OUTPUT=$(npx --yes @shipstatic/ship ./site --json)
          URL=$(echo "$OUTPUT" | jq -r '.url // empty')
          if [ -z "$URL" ]; then
            echo "Failed to get deployment URL from ShipStatic"
            exit 1
          fi
          echo "deploy-url=$URL" >> $GITHUB_OUTPUT

      - name: Resolve Preview URL
        id: info
        shell: bash
        run: |
          NETLIFY_URL="${{ steps.netlify.outputs.deploy-url }}"
          INSTANT_URL="${{ steps.instant.outputs.deploy-url }}"
          if [ -n "$NETLIFY_URL" ]; then
            echo "url=$NETLIFY_URL" >> $GITHUB_OUTPUT
            echo "provider=Netlify" >> $GITHUB_OUTPUT
          else
            echo "url=$INSTANT_URL" >> $GITHUB_OUTPUT
            echo "provider=ShipStatic" >> $GITHUB_OUTPUT
          fi

      - name: Report Preview URL
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.info.outputs.url }}
          PROVIDER: ${{ steps.info.outputs.provider }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "============================================="
          echo "🚀 Site preview deployed successfully!"
          echo "URL: $PREVIEW_URL"
          echo "Provider: $PROVIDER"
          echo "============================================="

          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ## 🚀 官网临时预览已就绪 (Site Preview Ready)

          | 项目 | 信息 |
          |---|---|
          | 🌐 **预览链接** | [**$PREVIEW_URL**]($PREVIEW_URL) |
          | 🛠️ **部署服务** | $PROVIDER |
          | 🌿 **分支** | \`pre\` |
          | 🔖 **提交** | [\`${{ github.sha }}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) |

          > 提示：在仓库 Secrets 中配置 \`NETLIFY_AUTH_TOKEN\` 与 \`NETLIFY_SITE_ID\` 即可自动无缝切换为 Netlify 专属部署。
          EOF

          gh api repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -f state=success \
            -f target_url="$PREVIEW_URL" \
            -f description="预览网页已就绪 ($PROVIDER)" \
            -f context="site/preview" || true

          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments \
            -f body="### 🚀 官网临时预览已部署 (Site Preview)

          - 🌐 **预览链接**: $PREVIEW_URL
          - 🛠️ **部署方式**: $PROVIDER
          - 🌿 **分支**: \`pre\` (\`${{ github.sha }}\`)" || true
